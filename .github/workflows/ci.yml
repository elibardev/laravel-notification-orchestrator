name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }} / Laravel 12
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify runtime requirements
        run: composer check-platform-reqs
      - name: Validate, test, analyse and check formatting
        run: composer check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test framework-neutral client
        run: npm test
